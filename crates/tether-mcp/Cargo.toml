[package]
name = "tether-mcp"
description = "McpClient trait, the built-in sandbox server, and the rmcp-backed client for external MCP servers."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
tether-types = { workspace = true }
tether-sandbox = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
reqwest = { workspace = true, optional = true }
rmcp = { version = "3.11", default-features = false, features = [
    "client",
    "transport-child-process",
    "transport-streamable-http-client-reqwest",
], optional = true }

[features]
# The protocol client for external servers. On by default; a build without it
# has only the built-in sandbox server and refuses any `[[mcp_server]]`.
default = ["rmcp"]
rmcp = ["dep:rmcp", "dep:reqwest"]

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
