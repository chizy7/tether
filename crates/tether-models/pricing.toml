# Model prices in US dollars per million tokens. The run loop records the
# cost of each model call in its budget.tick, with this table's version.
#
# Source: Anthropic first-party API rates as published on the date below.
# Prices change; check https://platform.claude.com/docs/en/about-claude/pricing
# and bump `version` when you edit a row.
#
# Only Anthropic models have rows. For any other model, or for prices that
# have moved, write a table in this format and name it in TETHER_PRICING; it
# replaces this one.
#
# A model missing from this table has no price: its calls cost nothing as far
# as max_usd is concerned, and its ticks carry no price.

version = "2026-11-03"

# Used for a row that gives no cache price of its own, as a multiple of its
# input price. A cache write here is the 5-minute kind; 1-hour writes cost
# more (2x input) and are under-counted.
cache_read_multiplier = 0.1
cache_write_multiplier = 1.25

[models.claude-fable-5-2]
input = 8.00
output = 40.00
cache_read = 0.20

[models.claude-fable-5-1]
input = 10.00
output = 50.00

[models.claude-fable-5]
input = 10.00
output = 50.00

[models.claude-opus-5-5]
input = 4.00
output = 20.00
cache_read = 0.20

[models.claude-opus-5]
input = 5.00
output = 25.00

[models.claude-opus-4-8]
input = 5.00
output = 25.00

[models.claude-opus-4-7]
input = 5.00
output = 25.00

[models.claude-opus-4-6]
input = 5.00
output = 25.00

[models.claude-sonnet-5-5]
input = 2.00
output = 10.00
cache_read = 0.10

[models.claude-sonnet-5]
input = 2.00
output = 10.00

[models.claude-sonnet-4-6]
input = 3.00
output = 15.00

# Prompts over 100K tokens cost more on this model (0.50 in, 2.50 out) and
# are under-counted here.
[models.claude-haiku-5-5]
input = 0.10
output = 0.50

[models.claude-haiku-4-5]
input = 1.00
output = 5.00
