[package]
name = "tether-cli"
description = "tether: run, replay, diff, eval, inspect, resume, verify, pack."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "tether"
path = "src/main.rs"

[dependencies]
tether-types = { workspace = true }
tether-trace = { workspace = true }
tether-core = { workspace = true }
tether-policy = { workspace = true }
tether-sandbox = { workspace = true }
tether-mcp = { workspace = true }
tether-models = { workspace = true }
tetherd = { path = "../tetherd", default-features = false }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
time = { workspace = true }
reqwest = { workspace = true }
tempfile = "3"
clap = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[features]
default = ["openai_compat"]
# The adapter for servers that speak the OpenAI Chat Completions shape.
openai_compat = ["tether-models/openai_compat", "tetherd/openai_compat"]

[lints]
workspace = true
