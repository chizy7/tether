[package]
name = "tether-core"
description = "Run loop, state machine, checkpoint, resume and replay."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
tether-types = { workspace = true }
tether-trace = { workspace = true }
tether-policy = { workspace = true }
tether-sandbox = { workspace = true }
tether-mcp = { workspace = true, default-features = false }
tether-models = { workspace = true }
tokio = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
time = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[features]
# The MCP wire-protocol client for `[[mcp_server]]`. Off, a policy that
# names a server fails at run start with a clear error.
default = ["rmcp"]
rmcp = ["tether-mcp/rmcp"]

[[example]]
name = "raw-loop"
path = "../../examples/raw-loop/main.rs"

[lints]
workspace = true
