[package]
name = "tetherd"
description = "gRPC daemon the Python and TypeScript SDKs talk to. Started on demand, exits after its last run."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
tether-core = { workspace = true }
tether-types = { workspace = true }
tether-policy = { workspace = true }
tether-sandbox = { workspace = true }
tether-mcp = { workspace = true }
tether-models = { workspace = true }
tether-trace = { workspace = true }
tokio = { workspace = true }
tokio-stream = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tonic = { workspace = true }
tonic-prost = { workspace = true }
prost = { workspace = true }
# For the client side of the Unix socket: `connect`.
hyper-util = { version = "0.1", features = ["tokio"] }
tower = { version = "0.5", features = ["util"] }

[build-dependencies]
tonic-prost-build = "0.14"
# A protoc binary shipped as a crate, so the build needs no system install.
protoc-bin-vendored = "3"

[dev-dependencies]
tempfile = "3"

# Not shipped on its own: the `tether` binary carries the daemon as
# `tether daemon`, and that is what a release installs.
[package.metadata.dist]
dist = false

[features]
default = ["openai_compat"]
# The adapter for servers that speak the OpenAI Chat Completions shape.
openai_compat = ["tether-models/openai_compat"]

[lints]
workspace = true
