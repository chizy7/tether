# One external MCP server beside the built-in sandbox tools.
#
# The reference filesystem server is started over stdio and given the run's
# workspace. Its tools keep their own names, except where one collides with a
# sandbox tool (`read_file`, `write_file`): the agent sees those as
# `fs__read_file` and `fs__write_file`. The rules below let the agent read through the server but not
# write through it, and let the sandbox do the writing.

[budget]
max_usd = 0.50
max_tool_calls = 20
max_wall_secs = 300
# Nobody is there to answer an ask: do not wait ten minutes for one.
ask_timeout_secs = 5

[[rule]]
name = "fs-read"
# Rules see every tool as `<server>.<tool>`, whatever name the agent used.
match = { server = "fs", tool = ["fs.read_*", "fs.list_*", "fs.get_file_info", "fs.directory_tree", "fs.search_files"] }
action = "allow"

[[rule]]
name = "fs-no-write"
match = { server = "fs" }
action = "deny"
reason = "writes go through the sandbox, where they are jailed"

# The sandbox's file tools. `exec` matches no rule, so it asks, and with
# nobody answering the run halts: a real model does not get to run commands.
[[rule]]
name = "sandbox-files"
match = { tool = ["sandbox.write_file", "sandbox.read_file", "sandbox.list_dir"] }
action = "allow"

[[mcp_server]]
id = "fs"
transport = "stdio"
command = "npx"
args = ["-y", "@modelcontextprotocol/server-filesystem", ".tether-mcp/workspace"]
env = ["HOME"]
timeout_secs = 120
