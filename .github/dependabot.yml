# Version updates, once a week, one PR per ecosystem. Security updates are
# separate: they are a repository setting and open a PR as soon as an
# advisory is published.
#
# GitHub Actions are left out on purpose. release.yml is generated by dist
# and fails its own check when edited by hand, and a bump to an action it
# shares with the other workflows would edit it.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      cargo:
        patterns: ["*"]

  - package-ecosystem: npm
    directories:
      - /sdks/typescript
      - /examples/raw-loop-ts
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: ["*"]

  - package-ecosystem: pip
    directories:
      - /sdks/python
      - /examples/openai-agents-sdk
    schedule:
      interval: weekly
    groups:
      pip:
        patterns: ["*"]
    ignore:
      # Pinned so regenerating the gRPC stubs gives the committed bytes.
      # Bump it by hand, together with the stubs.
      - dependency-name: grpcio-tools
