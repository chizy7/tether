name: ci

on:
  push:
    branches: [master]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The toolchain rust-toolchain.toml names, with clippy and rustfmt.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      # Format, clippy, the prose rule and the tests: the same recipe a
      # contributor runs before opening a pull request.
      - run: just check

  # The sandbox, the daemon's socket and the process limits differ on macOS,
  # so the workspace is linted and tested there too.
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - run: just lint test

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The toolchain rust-toolchain.toml names, with clippy and rustfmt.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy -p tether-sandbox --all-targets --features docker -- -D warnings
      - run: cargo test -p tether-sandbox --features docker

  python-sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The toolchain rust-toolchain.toml names, with clippy and rustfmt.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # The SDK's tests drive a real daemon.
      - run: cargo build -p tetherd
      - run: pip install -e "sdks/python[dev]"
      # Every Python file in the repository, the examples included.
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m pytest sdks/python
      # The v0.3 demo with the scripted model: record, replay, re-prompt, diff.
      - run: cargo build -p tether-cli
      - run: PATH="$PWD/target/debug:$PATH" python examples/replays/demo.py
      # A framework's own loop through the SDK, with the scripted model.
      - run: pip install -r examples/openai-agents-sdk/requirements.txt
      - run: PATH="$PWD/target/debug:$PATH" python examples/openai-agents-sdk/agent.py
      # The v0.4 demo with the scripted model: record the suite, check that
      # the recordings pass, and that the worse prompt fails exactly three.
      - name: examples/evals
        run: |
          export PATH="$PWD/target/debug:$PATH"
          python examples/evals/record.py
          tether eval examples/evals/suite
          if tether eval examples/evals/suite --system "$(cat examples/evals/regressed.txt)" --scripts examples/evals/scripts > eval.txt; then
            echo "the regressed prompt should fail the suite" >&2; exit 1
          fi
          cat eval.txt
          grep -q "17 passed, 3 failed" eval.txt
      # The committed gRPC stubs must match the proto.
      - run: sh sdks/python/scripts/gen_proto.sh && git diff --exit-code sdks/python/src/tether/_proto

  typescript-sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The toolchain rust-toolchain.toml names, with clippy and rustfmt.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      # The SDK's tests drive a real daemon.
      - run: cargo build -p tetherd
      - run: npm ci
        working-directory: sdks/typescript
      - run: npm run lint
        working-directory: sdks/typescript
      - run: npm test
        working-directory: sdks/typescript
      # The example, with the scripted model, against the SDK just built.
      - run: npm install
        working-directory: examples/raw-loop-ts
      - run: PATH="$GITHUB_WORKSPACE/target/debug:$PATH" npm start
        working-directory: examples/raw-loop-ts

  msrv:
    runs-on: ubuntu-latest
    env:
      # rust-toolchain.toml pins a newer Rust; this job is the one that must not use it.
      RUSTUP_TOOLCHAIN: "1.89"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.89
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace
