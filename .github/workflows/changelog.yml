name: changelog

# Every pull request adds its own line to CHANGELOG.md, so the file is never
# written up after the fact. A change nobody using Tether would notice (a
# dependency bump, CI, a typo) takes the `skip-changelog` label instead.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  pull-requests: read

jobs:
  changelog:
    runs-on: ubuntu-latest
    steps:
      - name: CHANGELOG.md is updated, or the pull request is labelled skip-changelog
        if: ${{ !contains(github.event.pull_request.labels.*.name, 'skip-changelog') }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if gh api "repos/$REPO/pulls/$PR/files" --paginate --jq '.[].filename' | grep -qx 'CHANGELOG.md'; then
            exit 0
          fi
          echo "::error::This pull request does not change CHANGELOG.md. Add a line under \"Unreleased\" (see CONTRIBUTING.md), or ask for the skip-changelog label if nobody using Tether would notice the change."
          exit 1
