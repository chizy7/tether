[workspace]
resolver = "2"
members = [
    "crates/tether-types",
    "crates/tether-trace",
    "crates/tether-policy",
    "crates/tether-sandbox",
    "crates/tether-mcp",
    "crates/tether-models",
    "crates/tether-core",
    "crates/tether-cli",
    "crates/tetherd",
]

[workspace.package]
version = "0.4.1"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/chizy7/tether"
rust-version = "1.89"

[workspace.dependencies]
# Shared types
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "0.3", features = ["serde", "formatting", "parsing"] }
thiserror = "2"
anyhow = "1"
blake3 = "1"
async-trait = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "fs", "process", "signal", "time", "io-util", "net"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
toml = "1"
tonic = "0.14"
prost = "0.14"
tonic-prost = "0.14"
tokio-stream = { version = "0.1", features = ["net"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "http2"] }

# Internal crates
tether-types = { path = "crates/tether-types" }
tether-trace = { path = "crates/tether-trace" }
tether-policy = { path = "crates/tether-policy" }
tether-sandbox = { path = "crates/tether-sandbox" }
tether-mcp = { path = "crates/tether-mcp" }
tether-models = { path = "crates/tether-models" }
tether-core = { path = "crates/tether-core" }

[workspace.lints.clippy]
all = "warn"
unwrap_used = "warn"

[profile.release]
lto = "thin"
codegen-units = 1

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
